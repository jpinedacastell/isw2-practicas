<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-card">
    <img class="login-logo" src="img/logo.svg" alt="Logo de la aplicación" width="72" height="72">
    <h1 class="login-title">Iniciar sesión</h1>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" aria-describedby="username-error">
        <p id="username-error" class="field-error"></p>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error">
        <p id="password-error" class="field-error"></p>
      </div>

      <button type="submit" class="login-submit">Entrar</button>
      <p id="login-message" class="login-message" role="status"></p>
    </form>
  </main>

  <script src="js/login.js" defer></script>
</body>
</html>
